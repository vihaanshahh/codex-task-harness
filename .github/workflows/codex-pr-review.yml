name: Inkling PR review

on:
  repository_dispatch:
    types: [inkling-pr-review-v1]

permissions: {}

concurrency:
  group: inkling-pr-review-${{ github.event.client_payload.number }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate and publish Inkling review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pr_reviewer.py receive --repo "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_PATH"
