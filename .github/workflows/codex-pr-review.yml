name: Codex PR review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: vars.CODEX_PR_REVIEW_ENABLED == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out trusted reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Capture pull request
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-pr-review"
          if python3 pr_reviewer.py capture --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --expected-head "$PR_HEAD_SHA" --skip-reviewed \
            --snapshot "$RUNNER_TEMP/codex-pr-review/snapshot.json"; then
            echo 'captured=true' >> "$GITHUB_OUTPUT"
          else
            capture_exit=$?
            if [ "$capture_exit" -ne 3 ]; then
              exit "$capture_exit"
            fi
          fi

      - name: Install Codex CLI
        if: steps.capture.outputs.captured == 'true'
        run: npm install -g @openai/codex@0.171.0

      - name: Review captured patches
        if: steps.capture.outputs.captured == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Set the OPENAI_API_KEY repository secret to enable Codex review."
            exit 1
          fi
          python3 pr_reviewer.py review \
            --snapshot "$RUNNER_TEMP/codex-pr-review/snapshot.json" \
            --result "$RUNNER_TEMP/codex-pr-review/result.json"

      - name: Upload review data
        if: steps.capture.outputs.captured == 'true'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-pr-review-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codex-pr-review/snapshot.json
            ${{ runner.temp }}/codex-pr-review/result.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: generate
    if: needs.generate.outputs.artifact-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download review data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact-id }}
          path: ${{ runner.temp }}/codex-pr-review
          merge-multiple: true

      - name: Publish comment review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 pr_reviewer.py publish --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --snapshot "$RUNNER_TEMP/codex-pr-review/snapshot.json" \
            --result "$RUNNER_TEMP/codex-pr-review/result.json"
