[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-task-harness"
version = "0.1.0"
description = "A durable, serial queue for scoped Codex tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-task = "codex_task:main"

[tool.setuptools]
py-modules = ["codex_task"]
